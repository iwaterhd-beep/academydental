<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Correcciones — Vallodental Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/login.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
  <link rel="stylesheet" href="/admin/admin-premium.css" />
  <link rel="stylesheet" href="/admin/admin-theme.css" />
</head>
<body class="admin-page admin-premium">

  <aside class="admin-sidebar"></aside>

  <main class="admin-main admin-main--corrections">
    <header class="admin-header">
      <div class="corr-header-top">
        <div>
          <p class="login-kicker">Profesor</p>
          <h2 class="login-title admin-page-title">Bandeja de correcciones</h2>
        </div>
        <div class="corr-header-filters">
          <label class="corr-filter">
            <span class="editor-label">Estado</span>
            <select class="editor-input" id="statusFilter">
              <option value="pending_review">Pendientes de revisión</option>
              <option value="failed">No aprobados</option>
              <option value="graded">Corregidas</option>
              <option value="">Todas las entregas</option>
            </select>
          </label>
          <label class="corr-filter">
            <span class="editor-label">Tipo</span>
            <select class="editor-input" id="kindFilter">
              <option value="">Actividades y exámenes</option>
              <option value="assignment">Solo actividades</option>
              <option value="exam">Solo exámenes</option>
            </select>
          </label>
          <label class="corr-filter corr-filter--search">
            <span class="editor-label">Buscar</span>
            <input class="editor-input" id="corrSearch" type="search" placeholder="Alumno, curso o actividad…" />
          </label>
        </div>
      </div>

      <div class="corr-stats" id="corrStats"></div>

      <div class="corr-group-tabs">
        <button type="button" class="corr-group-tab is-active" data-group="course">Por curso</button>
        <button type="button" class="corr-group-tab" data-group="student">Por alumno</button>
      </div>
    </header>

    <div class="corrections-workspace">
      <aside class="corrections-nav" id="corrNav" aria-label="Entregas por curso y alumno"></aside>
      <section class="corrections-detail" id="corrDetail" aria-label="Detalle de la entrega"></section>
    </div>
  </main>

  <script type="module">
    import { initAdminShell } from "./shell.js";
    import { initCorrectionsPage } from "./correcciones.js";

    initAdminShell("correcciones");
    initCorrectionsPage();
  </script>
</body>
</html>
