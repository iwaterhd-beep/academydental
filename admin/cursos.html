<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Cursos — Vallodental Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/login.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body class="admin-page">

  <aside class="admin-sidebar">
    <div>
      <p class="login-kicker">Panel</p>
      <h1 class="admin-brand">Vallodental<br><em>Academy</em></h1>
      <p class="admin-tag">Administración</p>
      <nav class="admin-nav">
        <a href="/admin/" class="admin-nav-link" data-nav="dashboard">Dashboard</a>
        <a href="/admin/cursos" class="admin-nav-link" data-nav="cursos">Cursos</a>
        <a href="/admin/alumnos" class="admin-nav-link" data-nav="alumnos">Alumnos</a>
        <a href="/admin/progreso" class="admin-nav-link" data-nav="progreso">Progreso</a>
        <a href="/admin/correcciones" class="admin-nav-link" data-nav="correcciones">Correcciones</a>
      </nav>
    </div>
    <div class="admin-footer">
      <p class="admin-user">cursos@admin.com</p>
      <button type="button" class="login-btn admin-logout" id="logoutBtn">Cerrar sesión</button>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header admin-header--row">
      <div>
        <p class="login-kicker">Contenido</p>
        <h2 class="login-title admin-page-title">Cursos</h2>
      </div>
      <a href="/admin/curso-editor?new=1" class="admin-btn admin-btn--gold" id="createCourseBtn">+ Crear curso</a>
    </header>

    <div class="admin-content">
      <div class="courses-grid" id="coursesGrid"></div>
    </div>
  </main>

  <script type="module">
    import { initAdminShell, showToast, confirmAction, escapeHtml } from "./shell.js";
    import { getCourses, deleteCourse, duplicateCourse, formatPrice, STATUS_LABELS } from "../js/data.js";

    initAdminShell("cursos");

    const grid = document.getElementById("coursesGrid");

    function badge(status) {
      return `<span class="admin-badge admin-badge--${status}">${STATUS_LABELS[status] || status}</span>`;
    }

    function render() {
      const courses = getCourses();
      grid.innerHTML = courses.length
        ? courses.map((c) => `
          <article class="course-admin-card">
            <div class="course-admin-cover" style="background-image:url('${c.coverImage || ""}')"></div>
            <div class="course-admin-body">
              <p class="login-kicker">${escapeHtml(c.category)} · ${escapeHtml(c.level)}</p>
              <h3 class="admin-card-title">${escapeHtml(c.title)}</h3>
              <p class="admin-muted">${escapeHtml(c.subtitle)}</p>
              <div class="course-admin-meta">
                ${badge(c.status)}
                <span>${formatPrice(c.price)}</span>
                <span>${c.structure?.length || 0} módulos</span>
              </div>
              <div class="course-admin-actions">
                <a href="/admin/curso-editor?id=${c.id}" class="admin-btn admin-btn--gold">Editar curso</a>
                <button type="button" class="admin-btn admin-btn--ghost" data-dup="${c.id}">Duplicar</button>
                <button type="button" class="admin-link-btn admin-link-btn--danger" data-del="${c.id}">Eliminar</button>
              </div>
            </div>
          </article>`).join("")
        : `<div class="admin-card admin-card--wide"><div class="admin-empty" style="padding:60px">No hay cursos. <a href="/admin/curso-editor?new=1">Crea el primero</a></div></div>`;

      grid.querySelectorAll("[data-del]").forEach((btn) => {
        btn.onclick = () => {
          if (!confirmAction("¿Eliminar curso?")) return;
          deleteCourse(btn.dataset.del);
          showToast("Curso eliminado");
          render();
        };
      });
      grid.querySelectorAll("[data-dup]").forEach((btn) => {
        btn.onclick = () => {
          const copy = duplicateCourse(btn.dataset.dup);
          if (copy) location.href = `/admin/curso-editor?id=${copy.id}`;
        };
      });
    }

    render();
  </script>
</body>
</html>
