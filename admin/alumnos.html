<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Alumnos — Vallodental Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/login.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body class="admin-page">

  <aside class="admin-sidebar">
    <div>
      <p class="login-kicker">Panel</p>
      <h1 class="admin-brand">Vallodental<br><em>Academy</em></h1>
      <p class="admin-tag">Administración</p>
      <nav class="admin-nav">
        <a href="/admin/" class="admin-nav-link" data-nav="dashboard">Dashboard</a>
        <a href="/admin/cursos" class="admin-nav-link" data-nav="cursos">Cursos</a>
        <a href="/admin/alumnos" class="admin-nav-link" data-nav="alumnos">Alumnos</a>
        <a href="/admin/progreso" class="admin-nav-link" data-nav="progreso">Progreso</a>
        <a href="/admin/correcciones" class="admin-nav-link" data-nav="correcciones">Correcciones</a>
      </nav>
    </div>
    <div class="admin-footer">
      <p class="admin-user">cursos@admin.com</p>
      <button type="button" class="login-btn admin-logout" id="logoutBtn">Cerrar sesión</button>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header admin-header--row">
      <div>
        <p class="login-kicker">Usuarios</p>
        <h2 class="login-title admin-page-title">Alumnos</h2>
      </div>
      <button type="button" class="admin-btn admin-btn--gold" id="openCreateBtn">+ Nuevo alumno</button>
    </header>

    <div class="admin-content">
      <div class="admin-card admin-card--wide">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Alumno</th>
                <th>Email</th>
                <th>Estado</th>
                <th>Cursos</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="studentsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <dialog class="admin-modal" id="studentModal">
    <form id="studentForm" class="admin-modal-inner">
      <div class="admin-modal-head">
        <h3 class="admin-card-title" id="modalTitle">Nuevo alumno</h3>
        <button type="button" class="admin-icon-btn" id="closeModalBtn" aria-label="Cerrar">×</button>
      </div>
      <input type="hidden" id="studentId" />
      <div class="admin-form-grid">
        <label class="admin-field">
          <span class="login-label">Nombre</span>
          <input class="admin-input" id="studentName" required />
        </label>
        <label class="admin-field">
          <span class="login-label">Email</span>
          <input class="admin-input" id="studentEmail" type="email" required />
        </label>
        <label class="admin-field">
          <span class="login-label">Estado</span>
          <select class="admin-input" id="studentStatus">
            <option value="active">Activo</option>
            <option value="blocked">Bloqueado</option>
          </select>
        </label>
      </div>
      <div class="admin-field">
        <span class="login-label">Cursos asignados</span>
        <div class="admin-checklist" id="courseChecklist"></div>
      </div>
      <div class="admin-modal-actions">
        <button type="button" class="admin-btn admin-btn--ghost" id="cancelModalBtn">Cancelar</button>
        <button type="submit" class="admin-btn admin-btn--gold">Guardar</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { initAdminShell, showToast, confirmAction, escapeHtml } from "./shell.js";
    import {
      getStudents,
      getStudent,
      getCourses,
      createStudent,
      saveStudent,
      deleteStudent,
      STATUS_LABELS,
    } from "../js/data.js";

    initAdminShell("alumnos");

    const modal = document.getElementById("studentModal");
    const form = document.getElementById("studentForm");
    const tbody = document.getElementById("studentsBody");
    const checklist = document.getElementById("courseChecklist");

    function courseNames(ids) {
      const courses = getCourses();
      return ids
        .map((id) => courses.find((c) => c.id === id)?.title)
        .filter(Boolean)
        .join(", ");
    }

    function badge(status) {
      return `<span class="admin-badge admin-badge--${status}">${STATUS_LABELS[status] || status}</span>`;
    }

    function renderChecklist(selected = []) {
      const courses = getCourses();
      checklist.innerHTML = courses.length
        ? courses
            .map(
              (c) => `
          <label class="admin-check">
            <input type="checkbox" name="courseIds" value="${c.id}" ${selected.includes(c.id) ? "checked" : ""} />
            <span>${escapeHtml(c.title)}</span>
          </label>`
            )
            .join("")
        : `<p class="admin-muted">Crea cursos primero en la sección Cursos.</p>`;
    }

    function renderStudents() {
      const students = getStudents();
      tbody.innerHTML = students.length
        ? students
            .map(
              (s) => `
          <tr>
            <td><strong>${escapeHtml(s.name)}</strong></td>
            <td>${escapeHtml(s.email)}</td>
            <td>${badge(s.status)}</td>
            <td>${escapeHtml(courseNames(s.courseIds) || "—")}</td>
            <td class="admin-actions">
              <button type="button" class="admin-link-btn" data-edit="${s.id}">Editar</button>
              <button type="button" class="admin-link-btn admin-link-btn--danger" data-delete="${s.id}">Eliminar</button>
            </td>
          </tr>`
            )
            .join("")
        : `<tr><td colspan="5" class="admin-empty">No hay alumnos registrados.</td></tr>`;

      tbody.querySelectorAll("[data-edit]").forEach((btn) =>
        btn.addEventListener("click", () => openEdit(btn.dataset.edit))
      );
      tbody.querySelectorAll("[data-delete]").forEach((btn) =>
        btn.addEventListener("click", () => removeStudent(btn.dataset.delete))
      );
    }

    function getSelectedCourses() {
      return [...checklist.querySelectorAll('input[name="courseIds"]:checked')].map((el) => el.value);
    }

    function openCreate() {
      form.reset();
      document.getElementById("studentId").value = "";
      document.getElementById("modalTitle").textContent = "Nuevo alumno";
      renderChecklist();
      modal.showModal();
    }

    function openEdit(id) {
      const student = getStudent(id);
      if (!student) return;
      document.getElementById("studentId").value = student.id;
      document.getElementById("studentName").value = student.name;
      document.getElementById("studentEmail").value = student.email;
      document.getElementById("studentStatus").value = student.status;
      document.getElementById("modalTitle").textContent = "Editar alumno";
      renderChecklist(student.courseIds);
      modal.showModal();
    }

    function removeStudent(id) {
      const student = getStudent(id);
      if (!student) return;
      if (!confirmAction(`¿Eliminar a "${student.name}"?`)) return;
      deleteStudent(id);
      showToast("Alumno eliminado");
      renderStudents();
    }

    function closeModal() {
      modal.close();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const id = document.getElementById("studentId").value;
      const payload = {
        name: document.getElementById("studentName").value.trim(),
        email: document.getElementById("studentEmail").value.trim(),
        status: document.getElementById("studentStatus").value,
        courseIds: getSelectedCourses(),
      };

      if (!payload.name || !payload.email) return;

      if (id) {
        saveStudent({ ...getStudent(id), ...payload });
        showToast("Alumno actualizado");
      } else {
        createStudent(payload);
        showToast("Alumno creado");
      }

      closeModal();
      renderStudents();
    });

    document.getElementById("openCreateBtn").addEventListener("click", openCreate);
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    document.getElementById("cancelModalBtn").addEventListener("click", closeModal);

    renderStudents();
  </script>
</body>
</html>
