<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Academia online de formación en prótesis dentales — Vallodental Academy" />
  <meta name="theme-color" content="#080808" />
  <meta property="og:title" content="Vallodental Academy" />
  <meta property="og:description" content="Academia online de formación en prótesis dentales" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_ES" />
  <title>Acceder — Vallodental Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>

  <button type="button" class="theme-toggle theme-toggle--float" data-theme-toggle aria-label="Activar modo claro">
    <svg class="theme-icon theme-icon--sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
    <svg class="theme-icon theme-icon--moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
  </button>

  <div class="login-layout">
    <div class="login-visual">
      <a href="/" class="login-logo">
        <span class="login-logo-title">Vallodental Academy</span>
        <span class="login-logo-tag">Formación · Prótesis dental</span>
      </a>
      <div class="login-visual-copy">
        <p class="login-kicker">Campus online</p>
        <h1>Accede a tu<br><em>formación.</em></h1>
        <p>Introduce tus credenciales para entrar al campus de formación en prótesis dental.</p>
      </div>
    </div>

    <div class="login-panel">
      <div class="login-panel-inner">
        <p class="login-kicker">Bienvenido</p>
        <h2 class="login-title">Iniciar sesión</h2>

        <form id="loginForm" novalidate>
          <div class="login-field">
            <label class="login-label" for="email">Email</label>
            <input class="login-input" type="email" id="email" name="email" required autocomplete="username" placeholder="tu@email.com" />
          </div>
          <div class="login-field">
            <label class="login-label" for="password">Contraseña</label>
            <input class="login-input" type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
          </div>
          <button type="submit" class="login-btn">Entrar</button>
        </form>

        <p class="login-status" id="loginStatus" hidden role="alert"></p>
        <p class="login-hint admin-muted" style="margin-top:24px;font-size:12px;line-height:1.8">
          Admin: <strong>cursos@admin.com</strong> · Alumno: <strong>cursos@alumno.com</strong><br>
          Contraseña: <strong>9999</strong>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
