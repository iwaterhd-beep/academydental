<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Curso — Vallodental Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/login.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/campus/campus.css" />
  <link rel="stylesheet" href="/campus/dashboard.css" />
  <link rel="stylesheet" href="/campus/campus-theme.css" />
  <link rel="stylesheet" href="/campus/player.css" />
</head>
<body class="campus-player-page">

  <header class="player-topbar">
    <div class="player-topbar-left">
      <button type="button" class="player-menu-btn" id="sidebarToggle" aria-label="Temario">☰</button>
      <a href="/campus/" class="player-back">← Campus</a>
    </div>
    <div class="player-topbar-center" id="playerBreadcrumb"></div>
    <div class="player-topbar-right">
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Activar modo claro">
        <svg class="theme-icon theme-icon--sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
        <svg class="theme-icon theme-icon--moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
      </button>
      <div class="player-top-progress" id="playerProgress"></div>
      <div class="player-top-user" id="playerUser"></div>
      <button type="button" class="campus-btn campus-btn--ghost player-logout" id="logoutBtn">Salir</button>
    </div>
  </header>

  <div class="player-layout">
    <aside class="player-sidebar" id="sidebar"></aside>
    <div class="player-main">
      <div class="player-stage">
        <main class="campus-content" id="content"></main>
        <aside class="player-tools" id="playerTools" hidden></aside>
      </div>
    </div>
  </div>

  <button type="button" class="player-tools-fab" id="toolsToggle" aria-label="Panel de estudio" hidden>✎</button>
  <div class="player-overlay" id="playerOverlay"></div>
  <div class="player-cinema-backdrop" id="cinemaBackdrop" hidden></div>
  <p class="pp-keyboard-hint" aria-hidden="true">← → o P / N para navegar lecciones</p>

  <script type="module" src="/campus/curso.js"></script>
</body>
</html>
